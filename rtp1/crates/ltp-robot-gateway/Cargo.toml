[package]
name = "ltp-robot-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bridge anvil_streamer WebSocket JPEG cameras to LTP/UDP and LTP control to quest_teleop TCP"

[[bin]]
name = "ltp-robot-gateway"
path = "src/main.rs"

[dependencies]
teleop-transport = { path = "../teleop-transport" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
