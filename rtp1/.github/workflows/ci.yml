name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets
      - run: cargo build -p teleop-transport --release
      - run: python3 python/ltp_ctypes.py
      - run: |
          cc -o /tmp/abi_smoke examples/abi_smoke.c -L target/release -lteleop_transport
          LD_LIBRARY_PATH=target/release /tmp/abi_smoke
